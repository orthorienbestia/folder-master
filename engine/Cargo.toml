[package]
name = "folder-master-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "folder_master_engine"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
base64 = "=0.22.1"
rusqlite = { version = "=0.41.1", default-features = false, features = ["libsqlite3-sys", "bundled", "backup"] }
libc = "=0.2.186"
unicode-segmentation = "=1.12.0"
regex = "=1.13.1"
unicode-normalization = "=0.1.26"
