name: FolderMaster
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    COMBINE_HIDPI_IMAGES: YES
targets:
  FolderMaster:
    type: application
    platform: macOS
    sources: [FolderMaster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.app
        PRODUCT_NAME: Folder Master
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/FolderMaster-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/../build/rust/$(CONFIGURATION)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lfolder_master_engine", "-liconv", "-lresolv"]
    info:
      path: FolderMaster/Info.plist
      properties:
        CFBundleDisplayName: Folder Master
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Folder Master
    preBuildScripts:
      - name: Build pinned Rust engine
        path: ../scripts/build-engine.sh
        basedOnDependencyAnalysis: false
        outputFiles: ["$(PROJECT_DIR)/../build/rust/$(CONFIGURATION)/libfolder_master_engine.a"]
  FolderMasterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FolderMaster/Shared, Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
schemes:
  FolderMaster:
    build:
      targets:
        FolderMaster: all
        FolderMasterTests: [test]
    test:
      targets: [FolderMasterTests]
      gatherCoverageData: true
      parallelizeBuild: false
