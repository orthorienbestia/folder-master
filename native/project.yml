name: FolderMaster
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    COMBINE_HIDPI_IMAGES: YES
targets:
  FolderMaster:
    type: application
    platform: macOS
    sources: [FolderMaster]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.app
        PRODUCT_NAME: Folder Master
        SWIFT_OBJC_BRIDGING_HEADER: Bridge/FolderMaster-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(PROJECT_DIR)/../build/rust/$(CONFIGURATION)"]
        OTHER_LDFLAGS: ["$(inherited)", "-lfolder_master_engine", "-liconv", "-lresolv"]
    info:
      path: FolderMaster/Info.plist
      properties:
        CFBundleDisplayName: Folder Master
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Folder Master
    preBuildScripts:
      - name: Build pinned Rust engine
        path: ../scripts/build-engine.sh
        basedOnDependencyAnalysis: false
        outputFiles: ["$(PROJECT_DIR)/../build/rust/$(CONFIGURATION)/libfolder_master_engine.a"]
  FolderMasterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [FolderMaster/Shared, Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  ScriptProofHost:
    type: application
    platform: macOS
    sources: [../tests/native/script-proof/Host, ../tests/native/script-proof/Shared]
    dependencies:
      - target: ScriptProofService
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.script-proof
        PRODUCT_NAME: FolderMasterScriptProof
        SWIFT_OBJC_BRIDGING_HEADER: ../tests/native/script-proof/Shared/ScriptProof-Bridging-Header.h
    info:
      path: ../tests/native/script-proof/Host/Info.plist
      properties:
        LSBackgroundOnly: true
        LSMinimumSystemVersion: "14.0"
  ScriptProofService:
    type: xpc-service
    platform: macOS
    sources: [../tests/native/script-proof/Service, ../tests/native/script-proof/Shared]
    dependencies:
      - target: ScriptIsolationProbe
        link: false
        embed: false
    postBuildScripts:
      - name: Embed unentitled isolation probe
        script: |
          set -eu
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          cp "$BUILT_PRODUCTS_DIR/ScriptIsolationProbe" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers/ScriptIsolationProbe"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/ScriptIsolationProbe"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/ScriptIsolationProbe"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.script-proof.service
        PRODUCT_NAME: ScriptProofService
        SWIFT_OBJC_BRIDGING_HEADER: ../tests/native/script-proof/Shared/ScriptProof-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: ../tests/native/script-proof/Service/ScriptProofService.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_APP_SANDBOX: YES
    info:
      path: ../tests/native/script-proof/Service/Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        XPCService:
          ServiceType: Application
  ScriptIsolationProbe:
    type: tool
    platform: macOS
    sources: [../tests/native/script-proof/Probe, ../tests/native/script-proof/Shared/IsolationProbe.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.foldermaster.script-proof.probe
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SWIFT_OBJC_BRIDGING_HEADER: ../tests/native/script-proof/Shared/ScriptProof-Bridging-Header.h
schemes:
  ScriptProof:
    build:
      targets:
        ScriptProofHost: all
  FolderMaster:
    build:
      targets:
        FolderMaster: all
        FolderMasterTests: [test]
    test:
      targets: [FolderMasterTests]
      gatherCoverageData: true
      parallelizeBuild: false
